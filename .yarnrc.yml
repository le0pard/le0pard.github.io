approvedGitRepositories:
  - "**"

compressionLevel: mixed

enableGlobalCache: false

enableScripts: true

nodeLinker: node-modules

npmMinimalAgeGate: 0

supportedArchitectures:
  cpu:
    - x64
    - arm64
  os:
    - linux
    - darwin

yarnPath: .yarn/releases/yarn-4.18.1.cjs

# @astrojs/astro2tsx loads @napi-rs/wasm-runtime, whose peer @emnapi/runtime it doesn't declare
packageExtensions:
  "@astrojs/astro2tsx@*":
    dependencies:
      "@emnapi/runtime": "1.11.3"
